<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <link rel="stylesheet" href="{% static 'attendance/scanner.css' %}">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <h2>Scan Student QR Code</h2>

    <div id="reader"></div>

    <div id="result">
        Waiting for scan...
    </div>
    <div id="success-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">

        <div class="bg-white rounded-xl p-8 w-96">

            <div class="text-center">

                <div class="text-5xl text-green-500">

                    ✓

                </div>

                <h2 id="scan-status" class="text-2xl font-bold mt-4">
                </h2>

                <p id="scan-student" class="mt-2 text-gray-600">
                </p>

                <button onclick="closeModal()" class="mt-5 bg-blue-600 text-white px-4 py-2 rounded">
                    Close
                </button>

            </div>

        </div>

    </div>
    <script>

        function onScanSuccess(decodedText) {

            const qrData = JSON.parse(
                decodedText
            );

            fetch(

                "/api/attendance/scan/",

                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        student_id:
                            qrData.student_id

                    })

                }

            )

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Network Error"
                        );

                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById(
                        "scan-status"
                    ).innerText = data.status;

                    document.getElementById(
                        "scan-student"
                    ).innerText = data.student;

                    document.getElementById(
                        "success-modal"
                    ).classList.remove(
                        "hidden"
                    );

                })

                .catch(error => {

                    if (
                        typeof queueAttendance
                        === "function"
                    ) {

                        queueAttendance(
                            qrData.student_id
                        );

                    }

                    alert(

                        "Internet unavailable.\n\nAttendance saved locally and will sync automatically when connection returns."

                    );

                });

        }

        new Html5QrcodeScanner(

            "reader",

            {

                fps: 10,

                qrbox: 250

            }

        ).render(
            onScanSuccess
        );

        function closeModal() {

            document
                .getElementById(
                    "success-modal"
                )
                .classList.add(
                    "hidden"
                );

        }

    </script>

</body>

</html>
